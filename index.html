<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LIVE WIRE</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Live Wire">
<meta name="application-name" content="Live Wire">
<meta name="description" content="Live Wire: an electrician-themed twin-stick arcade shooter.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;width:100%;height:100%;background:#05070c;overflow:hidden;
    touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;position:fixed;inset:0}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block;image-rendering:auto;cursor:crosshair;touch-action:none;box-shadow:0 0 40px #0af3}
</style>
</head>
<body>
<canvas id="c" width="960" height="600"></canvas>
<script>
"use strict";
// ================= LIVE WIRE =================
let W = 960, H = 600;            // logical play-field size (changes with screen aspect)
let VS = 1, DPR = 1;             // logical->backing scale, device pixel ratio (capped)
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const IS_TOUCH = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

let fitQueued = false;
function queueFit() { if (fitQueued) return; fitQueued = true; requestAnimationFrame(() => { fitQueued = false; fit(); }); }
function fit() {
  const vv = window.visualViewport;
  const vw = Math.max(1, vv ? vv.width : innerWidth), vh = Math.max(1, vv ? vv.height : innerHeight);
  const ar = Math.min(2.5, Math.max(0.4, vw / vh));
  const SHORT = IS_TOUCH ? 520 : 600;      // bigger sprites/HUD on phones
  if (ar >= 1) { H = SHORT; W = Math.round(SHORT * ar); } else { W = SHORT; H = Math.round(SHORT / ar); }
  const s = Math.min(vw / W, vh / H);
  const cssW = Math.floor(W * s), cssH = Math.floor(H * s);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  cv.width = Math.round(cssW * DPR); cv.height = Math.round(cssH * DPR);
  VS = cv.width / W;
  buildBackground();
  if (player) { player.x = Math.min(Math.max(player.x, player.r), W - player.r); player.y = Math.min(Math.max(player.y, player.r), H - player.r); }
  for (const e of enemies) { if (e.boss) { e.x = Math.min(e.x, W - 60); e.y = Math.min(e.y, H - 60); } }
}
addEventListener('resize', queueFit);
addEventListener('orientationchange', () => setTimeout(fit, 250));
if (window.visualViewport) visualViewport.addEventListener('resize', queueFit);

// ---------- utils ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist2 = (ax, ay, bx, by) => (ax - bx) * (ax - bx) + (ay - by) * (ay - by);

// ---------- storage ----------
const HS_KEY = 'livewire_highscore';
let highScore = 0;
try { highScore = parseInt(localStorage.getItem(HS_KEY) || '0', 10) || 0; } catch (e) {}
function saveHS() { try { localStorage.setItem(HS_KEY, String(highScore)); } catch (e) {} }

// ---------- audio ----------
let actx = null, master = null, muted = false;
try { muted = localStorage.getItem('livewire_muted') === '1'; } catch (e) {}
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = muted ? 0 : 0.35;
    master.connect(actx.destination);
  } catch (e) { actx = null; }
}
function setMuted(m) {
  muted = m;
  if (master) master.gain.value = muted ? 0 : 0.35;
  try { localStorage.setItem('livewire_muted', muted ? '1' : '0'); } catch (e) {}
  toast(muted ? 'SOUND OFF' : 'SOUND ON');
}
function tone(type, f0, f1, dur, vol, delay) {
  if (!actx || muted) return;
  const t = actx.currentTime + (delay || 0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol, freq) {
  if (!actx || muted) return;
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = actx.currentTime;
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 2000;
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
let lastShotSnd = 0;
const SFX = {
  shoot() { const n = performance.now(); if (n - lastShotSnd < 45) return; lastShotSnd = n; tone('square', 880, 220, 0.07, 0.08); },
  hit() { tone('triangle', 400, 120, 0.06, 0.12); },
  kill() { noise(0.18, 0.25, 3000); tone('sawtooth', 300, 60, 0.15, 0.1); },
  hurt() { tone('sawtooth', 160, 50, 0.25, 0.25); noise(0.2, 0.2, 800); },
  pickup() { tone('sine', 523, 523, 0.08, 0.2); tone('sine', 784, 784, 0.12, 0.2, 0.08); },
  wave() { [392, 523, 659, 784].forEach((f, i) => tone('square', f, f, 0.12, 0.1, i * 0.09)); },
  boss() { tone('sawtooth', 110, 55, 0.8, 0.3); tone('square', 55, 40, 0.9, 0.2, 0.1); noise(0.8, 0.2, 400); },
  dash() { noise(0.12, 0.18, 5000); tone('sine', 200, 900, 0.1, 0.1); },
  zap() { tone('sawtooth', 1200, 300, 0.1, 0.06); },
  over() { [392, 330, 262, 196].forEach((f, i) => tone('triangle', f, f * 0.98, 0.3, 0.2, i * 0.22)); },
  bossDie() { for (let i = 0; i < 6; i++) { tone('sawtooth', 400 - i * 50, 40, 0.4, 0.15, i * 0.1); } noise(1.2, 0.35, 1500); }
};

// ---------- input: keyboard / mouse ----------
const keys = Object.create(null);
const mouse = { x: W / 2, y: H / 2, down: false };
let inputMode = IS_TOUCH ? 'touch' : 'kb'; // 'kb', 'pad' or 'touch'
let lastTouch = -1e9;
const fromTouch = () => performance.now() - lastTouch < 1000;
addEventListener('keydown', e => {
  initAudio();
  const k = e.key.toLowerCase();
  if (['w', 'a', 's', 'd', ' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  if (!keys[k]) onPress(k);
  keys[k] = true; inputMode = 'kb';
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * W / r.width;
  mouse.y = (e.clientY - r.top) * H / r.height;
}
cv.addEventListener('mousemove', e => { if (fromTouch()) return; toCanvas(e); inputMode = 'kb'; });
cv.addEventListener('mousedown', e => {
  if (fromTouch()) return;
  toCanvas(e); initAudio(); inputMode = 'kb';
  if (e.button === 0) { mouse.down = true; if (state === 'title' || state === 'over') startGame(); }
  if (e.button === 2) tryDash();
});
addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => { mouse.down = false; for (const k in keys) keys[k] = false; if (state === 'play') state = 'paused'; });

function onPress(k) {
  if (k === 'm') { setMuted(!muted); return; }
  if (k === 'p' || k === 'escape') { togglePause(); return; }
  if ((k === 'enter' || k === ' ') && (state === 'title' || state === 'over')) { startGame(); return; }
  if ((k === 'shift' || k === ' ') && state === 'play') tryDash();
}
function togglePause() {
  if (state === 'play') { state = 'paused'; tone('sine', 440, 220, 0.1, 0.1); }
  else if (state === 'paused') { state = 'play'; tone('sine', 220, 440, 0.1, 0.1); }
}

// ---------- input: gamepad (DualSense, standard mapping) ----------
const DEAD = 0.15;
let padIndex = -1;
const padPrev = [];
const pad = { lx: 0, ly: 0, rx: 0, ry: 0, r2: 0, active: false };
function dz(x, y) {
  const m = Math.hypot(x, y);
  if (m < DEAD) return [0, 0];
  const s = Math.min(1, (m - DEAD) / (1 - DEAD)) / m;
  return [x * s, y * s];
}
addEventListener('gamepadconnected', e => {
  padIndex = e.gamepad.index; inputMode = 'pad';
  toast('🎮 CONTROLLER CONNECTED');
});
addEventListener('gamepaddisconnected', e => {
  if (e.gamepad.index === padIndex) { padIndex = -1; pad.active = false; inputMode = 'kb'; toast('CONTROLLER DISCONNECTED'); if (state === 'play') state = 'paused'; }
});
function getPad() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  if (!pads) return null;
  if (padIndex >= 0 && pads[padIndex]) return pads[padIndex];
  for (const p of pads) if (p && p.connected) { padIndex = p.index; return p; }
  return null;
}
function btnVal(b) { return b ? (typeof b === 'object' ? (b.value || (b.pressed ? 1 : 0)) : b) : 0; }
function pollPad() {
  const g = getPad();
  pad.active = !!g;
  if (!g) return;
  const b = g.buttons, a = g.axes;
  const pressed = i => !!(b[i] && b[i].pressed);
  const edge = i => pressed(i) && !padPrev[i];
  [pad.lx, pad.ly] = dz(a[0] || 0, a[1] || 0);
  [pad.rx, pad.ry] = dz(a[2] || 0, a[3] || 0);
  pad.r2 = btnVal(b[7]);
  // d-pad also moves
  if (pressed(12)) pad.ly = -1; if (pressed(13)) pad.ly = 1;
  if (pressed(14)) pad.lx = -1; if (pressed(15)) pad.lx = 1;
  let any = pad.lx || pad.ly || pad.rx || pad.ry || pad.r2 > 0.1;
  for (let i = 0; i < b.length; i++) if (pressed(i)) any = true;
  if (any) { inputMode = 'pad'; initAudio(); }
  if (edge(9)) togglePause();                         // Options
  if (edge(8) || edge(17)) setMuted(!muted);           // Share/Create or Touchpad
  if (edge(0)) {                                        // Cross
    if (state === 'title' || state === 'over') startGame();
    else if (state === 'paused') togglePause();
    else if (state === 'play') tryDash();
  }
  if (edge(6) && state === 'play') tryDash();           // L2
  if (edge(4) && state === 'play') tryDash();           // L1
  for (let i = 0; i < b.length; i++) padPrev[i] = pressed(i);
}
function rumble(strong, weak, ms) {
  if (inputMode !== 'pad') return;
  const g = getPad(); if (!g) return;
  try {
    const va = g.vibrationActuator;
    if (va && typeof va.playEffect === 'function') {
      va.playEffect('dual-rumble', { startDelay: 0, duration: ms, strongMagnitude: strong, weakMagnitude: weak }).catch(() => {});
    } else if (g.hapticActuators && g.hapticActuators[0] && g.hapticActuators[0].pulse) {
      g.hapticActuators[0].pulse(strong, ms);
    }
  } catch (e) {}
}

// ---------- input: touch (twin virtual sticks) ----------
const STICK_R = 64;
const touch = { move: null, aim: null, mvx: 0, mvy: 0, avx: 0, avy: 0 };
function touchButtons() {
  return { dash: { x: W - 78, y: H - 170, r: 40 }, pause: { x: W - 34, y: 100, r: 24 } };
}
function toLogical(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
function hitC(c, x, y) { return dist2(c.x, c.y, x, y) <= (c.r + 12) * (c.r + 12); }
function stickVec(st) {
  if (!st) return [0, 0];
  const dx = st.x - st.ox, dy = st.y - st.oy, m = Math.hypot(dx, dy);
  if (m < STICK_R * 0.12) return [0, 0];
  const k = Math.min(1, m / STICK_R) / m;
  return [dx * k, dy * k];
}
let overAt = 0;
function goFullscreen() {
  if (!IS_TOUCH) return;
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) return;
  if (window.matchMedia && (matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches)) { lockLandscape(); return; }
  const rq = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!rq) return;
  try { const p = rq.call(el, { navigationUI: 'hide' }); if (p && p.then) p.then(lockLandscape).catch(() => {}); } catch (err) {}
}
function lockLandscape() {
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (err) {}
}
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  e.preventDefault();
  lastTouch = performance.now(); inputMode = 'touch'; initAudio();
  const [x, y] = toLogical(e);
  if (state === 'title' || state === 'over') {
    goFullscreen();
    if (state === 'over' && time - overAt < 0.9) return;   // avoid accidental instant restart
    startGame(); return;
  }
  if (state === 'paused') { goFullscreen(); togglePause(); return; }
  const B = touchButtons();
  if (hitC(B.pause, x, y)) { togglePause(); return; }
  if (hitC(B.dash, x, y)) { tryDash(); return; }
  if (x < W / 2) { if (!touch.move) touch.move = { id: e.pointerId, ox: x, oy: y, x, y }; }
  else if (!touch.aim) touch.aim = { id: e.pointerId, ox: x, oy: y, x, y };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
}, { passive: false });
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') return;
  e.preventDefault(); lastTouch = performance.now();
  const [x, y] = toLogical(e);
  for (const st of [touch.move, touch.aim]) {
    if (!st || st.id !== e.pointerId) continue;
    st.x = x; st.y = y;
    const dx = x - st.ox, dy = y - st.oy, m = Math.hypot(dx, dy);
    if (m > STICK_R * 1.4) { const k = (m - STICK_R * 1.4) / m; st.ox += dx * k; st.oy += dy * k; } // stick follows thumb
  }
}, { passive: false });
function endTouch(e) {
  if (e.pointerType === 'mouse') return;
  if (touch.move && touch.move.id === e.pointerId) touch.move = null;
  if (touch.aim && touch.aim.id === e.pointerId) touch.aim = null;
}
cv.addEventListener('pointerup', endTouch);
cv.addEventListener('pointercancel', endTouch);
cv.addEventListener('lostpointercapture', endTouch);
// block scrolling / zoom / pull-to-refresh / long-press menus / double-tap zoom
for (const ev of ['touchstart', 'touchmove', 'touchend', 'gesturestart', 'dblclick'])
  document.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'paused'; touch.move = touch.aim = null; });

function drawTouchUI() {
  if (inputMode !== 'touch' || state !== 'play') return;
  const B = touchButtons();
  const drawStick = (st, gx, gy, label) => {
    const ox = st ? st.ox : gx, oy = st ? st.oy : gy;
    ctx.globalAlpha = st ? 0.5 : 0.2;
    ctx.strokeStyle = '#7fdcff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(ox, oy, STICK_R, 0, 6.283); ctx.stroke();
    ctx.fillStyle = 'rgba(127,220,255,0.12)'; ctx.fill();
    let kx = ox, ky = oy;
    if (st) { const [vx, vy] = stickVec(st); kx = ox + vx * STICK_R; ky = oy + vy * STICK_R; }
    ctx.fillStyle = '#7fdcff'; ctx.beginPath(); ctx.arc(kx, ky, 26, 0, 6.283); ctx.fill();
    if (!st) { ctx.globalAlpha = 0.45; ctx.fillStyle = '#cde'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center'; ctx.fillText(label, gx, gy + STICK_R + 20); }
    ctx.globalAlpha = 1;
  };
  drawStick(touch.move, 110, H - 110, 'MOVE');
  drawStick(touch.aim, W - 190, H - 100, 'AIM + FIRE');
  // dash button
  const dr = Math.min(1, Math.max(0, 1 - player.dashCd / 0.9));
  ctx.globalAlpha = dr >= 1 ? 0.75 : 0.35;
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.arc(B.dash.x, B.dash.y, B.dash.r, 0, 6.283); ctx.fill();
  ctx.strokeStyle = '#7fdcff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(B.dash.x, B.dash.y, B.dash.r, -1.571, -1.571 + 6.283 * dr); ctx.stroke();
  ctx.fillStyle = '#7fdcff'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center'; ctx.fillText('DASH', B.dash.x, B.dash.y + 5);
  // pause button
  ctx.globalAlpha = 0.6; ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.arc(B.pause.x, B.pause.y, B.pause.r, 0, 6.283); ctx.fill();
  ctx.strokeStyle = '#cde'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#cde'; ctx.fillRect(B.pause.x - 7, B.pause.y - 9, 5, 18); ctx.fillRect(B.pause.x + 2, B.pause.y - 9, 5, 18);
  ctx.globalAlpha = 1;
}

// ---------- toast ----------
let toastMsg = '', toastT = 0;
function toast(m) { toastMsg = m; toastT = 2.2; }

// ---------- game state ----------
let state = 'title';
let player = null, bullets = [], ebullets = [], enemies = [], particles = [], pickups = [], floaters = [];
let score = 0, wave = 0, waveToSpawn = 0, spawnTimer = 0, waveDelay = 0, bossAlive = false, shake = 0, combo = 1, comboT = 0, time = 0, newHigh = false;
const bg = document.createElement('canvas');

function startGame() {
  initAudio();
  player = { x: W / 2, y: H / 2, r: 14, hp: 100, maxHp: 100, ang: 0, cd: 0, rapid: 0, shield: 0, inv: 0,
             dash: 0, dashCd: 0, dvx: 0, dvy: 0, walk: 0 };
  bullets = []; ebullets = []; enemies = []; particles = []; pickups = []; floaters = [];
  score = 0; wave = 0; waveToSpawn = 0; spawnTimer = 0; waveDelay = 1.2; bossAlive = false;
  shake = 0; combo = 1; comboT = 0; time = 0; newHigh = false;
  state = 'play';
  tone('square', 262, 523, 0.2, 0.15);
}

function nextWave() {
  wave++;
  if (wave % 5 === 0) {
    spawnBoss();
    waveToSpawn = 0;
    banner('WAVE ' + wave + ' — BOSS', 'THE OVERLOADED PANEL');
    SFX.boss(); rumble(1, 1, 600);
  } else {
    waveToSpawn = 6 + wave * 3;
    banner('WAVE ' + wave, waveFlavor[(wave - 1) % waveFlavor.length]);
    SFX.wave();
  }
  spawnTimer = 0.5;
}
const waveFlavor = ['Somebody skipped the permit', 'Rats in the attic', 'Brownout incoming', 'Knob & tube nightmare',
  'Aluminum wiring, 1972', 'Code violations everywhere', 'Who wired this?!', 'Ground fault city'];
let bannerT = 0, bannerA = '', bannerB = '';
function banner(a, b) { bannerA = a; bannerB = b; bannerT = 2.4; }

// ---------- enemies ----------
const ETYPES = {
  spark: { r: 9, hp: 1, spd: 150, score: 50, col: '#ffe14d', dmg: 8 },
  rat:   { r: 13, hp: 3, spd: 95, score: 100, col: '#9a8a7a', dmg: 12 },
  surge: { r: 20, hp: 8, spd: 55, score: 250, col: '#4dd2ff', dmg: 20 },
  arc:   { r: 15, hp: 4, spd: 70, score: 200, col: '#c070ff', dmg: 10 }
};
function edgePoint() {
  const s = Math.random() * 4 | 0;
  if (s === 0) return [rand(0, W), -30];
  if (s === 1) return [W + 30, rand(0, H)];
  if (s === 2) return [rand(0, W), H + 30];
  return [-30, rand(0, H)];
}
function spawnEnemy(type, x, y) {
  const t = ETYPES[type];
  if (x === undefined) [x, y] = edgePoint();
  const hpScale = 1 + Math.floor((wave - 1) / 5) * 0.5;
  const spdScale = 1 + Math.min(0.6, wave * 0.03);
  enemies.push({ type, x, y, r: t.r, hp: Math.ceil(t.hp * hpScale), maxHp: Math.ceil(t.hp * hpScale),
    spd: t.spd * spdScale * rand(0.9, 1.1), col: t.col, dmg: t.dmg, score: t.score,
    vx: 0, vy: 0, t: rand(0, 10), flash: 0, cd: rand(1.5, 3), boss: false });
}
function pickType() {
  const r = Math.random();
  if (wave >= 6 && r < 0.12) return 'arc';
  if (wave >= 3 && r < 0.28) return 'surge';
  if (r < 0.6) return 'spark';
  return 'rat';
}
function spawnBoss() {
  const lvl = wave / 5;
  enemies.push({ type: 'boss', x: W / 2, y: -80, r: 46, hp: 120 + lvl * 90, maxHp: 120 + lvl * 90, spd: 40 + lvl * 8,
    col: '#ff5a3c', dmg: 30, score: 5000 * lvl, vx: 0, vy: 0, t: 0, flash: 0, cd: 2, cd2: 4, boss: true, lvl, phase: 0 });
  bossAlive = true;
}

// ---------- particles ----------
function burst(x, y, col, n, spd, life) {
  for (let i = 0; i < n; i++) {
    if (particles.length > 500) particles.shift();
    const a = Math.random() * 6.283, s = rand(0.2, 1) * spd;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.5, 1) * life, max: life, col, sz: rand(1.5, 3.5) });
  }
}
function floater(x, y, txt, col) { floaters.push({ x, y, txt, col, t: 1 }); }

// ---------- player actions ----------
function tryDash() {
  if (state !== 'play' || player.dashCd > 0) return;
  let mx = 0, my = 0;
  if (inputMode === 'pad') { mx = pad.lx; my = pad.ly; }
  else if (inputMode === 'touch') { [mx, my] = stickVec(touch.move); }
  else { mx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0); my = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0); }
  if (!mx && !my) { mx = Math.cos(player.ang); my = Math.sin(player.ang); }

let shotCount = 0;
function shoot() {

  const n = wave >= 10 ? 2 : 1;

    const a = player.ang + rand(-spread, spread) + (n > 1 ? (i - 0.5) * 0.12 : 0);

}
function damagePlayer(d, x, y) {

// ---------- pickups ----------
const PTYPES = {
  tester: { col: '#ffd400', label: 'VOLTAGE TESTER', sub: 'RAPID FIRE' },
  nut:    { col: '#ff8c1a', label: 'WIRE NUTS', sub: 'SHIELD' },
  breaker:{ col: '#40ff7a', label: 'BREAKER RESET', sub: '+40 HP' }
};
function maybeDrop(x, y, boss) {
  if (boss) { dropPickup(x - 30, y, 'breaker'); dropPickup(x + 30, y, 'tester'); dropPickup(x, y + 30, 'nut'); return; }
  if (Math.random() < 0.075) {
    const r = Math.random();
    dropPickup(x, y, player.hp < 50 && r < 0.5 ? 'breaker' : r < 0.4 ? 'tester' : r < 0.75 ? 'nut' : 'breaker');
  }
}
function dropPickup(x, y, type) { pickups.push({ x: clamp(x, 20, W - 20), y: clamp(y, 20, H - 20), type, t: 0, life: 10 }); }
function collect(p) {
  const P = PTYPES[p.type];
  if (p.type === 'tester') player.rapid = 8;
  if (p.type === 'nut') player.shield = 10;
  if (p.type === 'breaker') player.hp = Math.min(player.maxHp, player.hp + 40);
  SFX.pickup(); rumble(0.1, 0.5, 90);
  floater(p.x, p.y - 10, P.sub, P.col);
  burst(p.x, p.y, P.col, 16, 150, 0.5);

// ---------- update ----------
function update(dt) {
  time += dt;
  if (toastT > 0) toastT -= dt;
  if (state !== 'play') { updateParticles(dt * (state === 'paused' ? 0 : 1)); return; }
  if (bannerT > 0) bannerT -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) combo = 1; }

  // wave control
  if (waveToSpawn <= 0 && !bossAlive && enemies.length === 0) {
    waveDelay -= dt;
    if (waveDelay <= 0) { nextWave(); waveDelay = 2.0; }
  }
  if (waveToSpawn > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const groupN = Math.random() < 0.25 ? 3 : 1;
      for (let i = 0; i < groupN && waveToSpawn > 0; i++) { spawnEnemy(pickType()); waveToSpawn--; }
      spawnTimer = Math.max(0.18, 0.9 - wave * 0.05) * rand(0.6, 1.3);
    }
  }

  // player movement
  const p = player;
  let mx, my;
  if (inputMode === 'pad') { mx = pad.lx; my = pad.ly; }
  else if (inputMode === 'touch') { [mx, my] = stickVec(touch.move); }
  else {
    mx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
    my = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
    const m = Math.hypot(mx, my); if (m > 0) { mx /= m; my /= m; }
  }
  const spd = 250;
  if (p.dash > 0) { p.dash -= dt; p.x += p.dvx * dt; p.y += p.dvy * dt;
    if (Math.random() < 0.8) particles.push({ x: p.x, y: p.y, vx: 0, vy: 0, life: 0.25, max: 0.25, col: '#7fdcff', sz: 6 }); }
  else { p.x += mx * spd * dt; p.y += my * spd * dt; }
  if (mx || my) p.walk += dt * 12;
  p.x = clamp(p.x, p.r, W - p.r); p.y = clamp(p.y, p.r, H - p.r);
  p.cd -= dt; p.dashCd -= dt; p.inv -= dt;
  if (p.rapid > 0) p.rapid -= dt;
  if (p.shield > 0) p.shield -= dt;

  // aiming / firing
  let firing = false;
  const assist = () => {   // aim assist: turn toward nearest enemy
    let best = null, bd = 1e12;
    for (const e of enemies) { const d = dist2(p.x, p.y, e.x, e.y); if (d < bd) { bd = d; best = e; } }
    if (best) { const ta = Math.atan2(best.y - p.y, best.x - p.x); let da = ta - p.ang;
      while (da > Math.PI) da -= 6.283; while (da < -Math.PI) da += 6.283; p.ang += da * Math.min(1, dt * 12); }
    else if (mx || my) p.ang = Math.atan2(my, mx);
  };
  if (inputMode === 'pad') {
    if (pad.rx || pad.ry) p.ang = Math.atan2(pad.ry, pad.rx); else assist();
    firing = pad.r2 > 0.2 || Math.hypot(pad.rx, pad.ry) > 0.7;
  } else if (inputMode === 'touch') {
    const [ax, ay] = stickVec(touch.aim);
    if (Math.hypot(ax, ay) > 0.2) p.ang = Math.atan2(ay, ax); else assist();
    firing = !!touch.aim;
  } else {
    p.ang = Math.atan2(mouse.y - p.y, mouse.x - p.x);
    firing = mouse.down;
  }
  if (firing && p.cd <= 0) shoot();

  // bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i]; b.px = b.x; b.py = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) { bullets.splice(i, 1); continue; }
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      if (dist2(b.x, b.y, e.x, e.y) < (e.r + 4) * (e.r + 4)) {
        e.hp -= 1; e.flash = 0.08;
        e.x += b.vx * 0.006 * (e.boss ? 0.1 : 1); e.y += b.vy * 0.006 * (e.boss ? 0.1 : 1);
        burst(b.x, b.y, e.col, 4, 140, 0.3);
        bullets.splice(i, 1);
        if (e.hp <= 0) killEnemy(j); else SFX.hit();
        break;
      }
    }
  }

  // enemies
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i]; e.t += dt; if (e.flash > 0) e.flash -= dt;
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    if (e.type === 'spark') {
      const wob = Math.sin(e.t * 9) * 0.6;
      const ax = dx / d, ay = dy / d;
      e.x += (ax - ay * wob) * e.spd * dt; e.y += (ay + ax * wob) * e.spd * dt;
    } else if (e.type === 'rat') {
      // zig-zag scurry with pauses
      const go = (Math.sin(e.t * 3) > -0.4) ? 1 : 0.15;
      const zz = Math.sin(e.t * 6) * 0.9;
      e.x += (dx / d - dy / d * zz) * e.spd * go * dt * 1.3; e.y += (dy / d + dx / d * zz) * e.spd * go * dt * 1.3;
    } else if (e.type === 'surge') {
      e.x += dx / d * e.spd * dt; e.y += dy / d * e.spd * dt;
    } else if (e.type === 'arc') {
      // keeps distance and shoots
      const want = d > 260 ? 1 : d < 200 ? -1 : 0;
      e.x += (dx / d * want + -dy / d * 0.6) * e.spd * dt; e.y += (dy / d * want + dx / d * 0.6) * e.spd * dt;
      e.cd -= dt;
      if (e.cd <= 0 && e.x > 0 && e.x < W && e.y > 0 && e.y < H) { e.cd = rand(1.6, 2.6); fireE(e.x, e.y, Math.atan2(dy, dx), 260); SFX.zap(); }
    } else if (e.type === 'boss') {
      updateBoss(e, dt, dx, dy, d);
    }
    // contact
    if (dist2(e.x, e.y, p.x, p.y) < (e.r + p.r - 3) * (e.r + p.r - 3)) {
      damagePlayer(e.dmg, e.x, e.y);
      if (!e.boss && state === 'play') { e.hp -= 2; burst(e.x, e.y, e.col, 8, 150, 0.4); if (e.hp <= 0) { killEnemy(i, true); continue; }
        e.x -= dx / d * 30; e.y -= dy / d * 30; }
    }
  }
  // simple separation (cheap)
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i]; if (a.boss) continue;
    for (let j = i + 1; j < Math.min(enemies.length, i + 8); j++) {
      const b = enemies[j]; if (b.boss) continue;
      const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r, d2 = dx * dx + dy * dy;
      if (d2 < rr * rr && d2 > 0.01) { const d = Math.sqrt(d2), push = (rr - d) * 0.5 / d; a.x -= dx * push; a.y -= dy * push; b.x += dx * push; b.y += dy * push; }
    }
  }

  // enemy bullets
  for (let i = ebullets.length - 1; i >= 0; i--) {
    const b = ebullets[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) { ebullets.splice(i, 1); continue; }
    if (dist2(b.x, b.y, p.x, p.y) < (p.r + b.r) * (p.r + b.r)) { ebullets.splice(i, 1); damagePlayer(b.dmg, b.x, b.y); }
  }

  // pickups
  for (let i = pickups.length - 1; i >= 0; i--) {
    const k = pickups[i]; k.t += dt; k.life -= dt;
    if (k.life <= 0) { pickups.splice(i, 1); continue; }
    const d2 = dist2(k.x, k.y, p.x, p.y);
    if (d2 < 90 * 90) { const d = Math.sqrt(d2) || 1; k.x += (p.x - k.x) / d * 220 * dt; k.y += (p.y - k.y) / d * 220 * dt; }
    if (d2 < (p.r + 14) * (p.r + 14)) { collect(k); pickups.splice(i, 1); }
  }
  updateParticles(dt);
}
function fireE(x, y, a, s, dmg) { ebullets.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 6, life: 5, dmg: dmg || 10 }); }
function updateBoss(e, dt, dx, dy, d) {
  // enter then hover/strafe
  if (e.y < 110) { e.y += 60 * dt; return; }
  const enraged = e.hp < e.maxHp * 0.4;
  e.x += Math.sin(e.t * 0.7) * 120 * dt + dx / d * e.spd * 0.4 * dt;
  e.y += Math.cos(e.t * 0.5) * 50 * dt + dy / d * e.spd * 0.4 * dt;
  e.x = clamp(e.x, 60, W - 60); e.y = clamp(e.y, 60, H - 60);
  e.cd -= dt; e.cd2 -= dt;
  if (e.cd <= 0) {
    // radial arc burst
    const n = 10 + e.lvl * 2 + (enraged ? 6 : 0), off = e.t;
    for (let i = 0; i < n; i++) fireE(e.x, e.y, off + i * 6.283 / n, 170 + e.lvl * 15, 12);
    e.cd = enraged ? 1.3 : 2.1; SFX.zap(); shake = Math.min(10, shake + 3);
  }

    // spawn sparks + aimed triple
    for (let i = 0; i < 3 + e.lvl; i++) spawnEnemy('spark', e.x + rand(-40, 40), e.y + rand(-40, 40));
    const a = Math.atan2(dy, dx);
    for (let k = -1; k <= 1; k++) fireE(e.x, e.y, a + k * 0.18, 300, 14);

}
function killEnemy(j, noScore) {
  const e = enemies[j];
  enemies.splice(j, 1);
  if (!noScore) {
    const pts = Math.round(e.score * combo);
    score += pts; floater(e.x, e.y - e.r, '+' + pts, '#fff');
    combo = Math.min(5, combo + 0.1); comboT = 2;
  }
  burst(e.x, e.y, e.col, e.boss ? 120 : 14 + e.r, e.boss ? 400 : 220, e.boss ? 1.4 : 0.6);
  burst(e.x, e.y, '#ffffff', e.boss ? 40 : 5, 300, 0.3);
  if (e.boss) {
    bossAlive = false; SFX.bossDie(); shake = 20; rumble(1, 1, 900);
    banner('PANEL DE-ENERGIZED', '+' + Math.round(e.score * combo) + ' — LOCKOUT / TAGOUT COMPLETE');
    // clear remaining threats
    for (const o of enemies) burst(o.x, o.y, o.col, 8, 150, 0.4);

  } else {
    SFX.kill(); rumble(0.15, 0.35, 60);
    if (e.type === 'surge' && wave >= 4) { for (let i = 0; i < 2; i++) spawnEnemy('spark', e.x + rand(-10, 10), e.y + rand(-10, 10)); }
  }

}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i]; q.life -= dt;
    if (q.life <= 0) { particles[i] = particles[particles.length - 1]; particles.pop(); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.92; q.vy *= 0.92;
  }
  for (let i = floaters.length - 1; i >= 0; i--) { const f = floaters[i]; f.t -= dt; f.y -= 30 * dt; if (f.t <= 0) floaters.splice(i, 1); }
}

// ---------- rendering ----------
function buildBackground() {
  bg.width = W; bg.height = H;
  const b = bg.getContext('2d');
  b.fillStyle = '#0b0f17'; b.fillRect(0, 0, W, H);
  // concrete-ish speckle
  for (let i = 0; i < 2500; i++) { b.fillStyle = `rgba(255,255,255,${Math.random() * 0.03})`; b.fillRect(Math.random() * W, Math.random() * H, 2, 2); }
  // grid floor tiles
  b.strokeStyle = 'rgba(80,140,200,0.07)'; b.lineWidth = 1;
  for (let x = 0; x <= W; x += 48) { b.beginPath(); b.moveTo(x + .5, 0); b.lineTo(x + .5, H); b.stroke(); }
  for (let y = 0; y <= H; y += 48) { b.beginPath(); b.moveTo(0, y + .5); b.lineTo(W, y + .5); b.stroke(); }
  // conduit runs along edges
  const runs = [['#b33', 22], ['#222', 30], ['#2a5', 38]];
  for (const [c, o] of runs) {
    b.strokeStyle = c; b.globalAlpha = 0.35; b.lineWidth = 3;
    b.strokeRect(o, o, W - o * 2, H - o * 2);
  }
  b.globalAlpha = 1;
  // junction boxes
  b.fillStyle = '#1a2230'; b.strokeStyle = '#334';
  for (const [x, y] of [[30, 30], [W - 30, 30], [30, H - 30], [W - 30, H - 30], [W / 2, 30], [W / 2, H - 30]]) {
    b.fillRect(x - 12, y - 12, 24, 24); b.strokeRect(x - 12, y - 12, 24, 24);
  }
  // stenciled floor text
  b.save(); b.translate(W / 2, H / 2); b.rotate(-0.08);
  b.font = 'bold 70px Impact, Arial Black, sans-serif'; b.textAlign = 'center'; b.textBaseline = 'middle';
  b.fillStyle = 'rgba(255,200,0,0.035)'; b.fillText('DANGER: HIGH VOLTAGE', 0, 0);
  b.restore();
  // vignette
  const g = b.createRadialGradient(W / 2, H / 2, 200, W / 2, H / 2, 620);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
}

function drawPlayer(p) {
  ctx.save(); ctx.translate(p.x, p.y);
  if (p.inv > 0 && p.dash <= 0 && Math.floor(time * 20) % 2) ctx.globalAlpha = 0.45;
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(2, 6, 15, 9, 0, 0, 6.283); ctx.fill();
  ctx.rotate(p.ang);
  // boots/legs
  const st = Math.sin(p.walk) * 4;
  ctx.fillStyle = '#3a2a1a'; ctx.fillRect(-6 + st, -10, 8, 6); ctx.fillRect(-6 - st, 4, 8, 6);
  // body (hi-vis vest)
  ctx.fillStyle = '#ff9a1a'; ctx.beginPath(); ctx.arc(0, 0, 12, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#e0ff40'; ctx.fillRect(-3, -12, 3, 24);
  // tool belt
  ctx.fillStyle = '#5a3a1a'; ctx.fillRect(-10, -2, 4, 4);
  // gun = cordless drill / zapper
  ctx.fillStyle = '#222'; ctx.fillRect(6, 3, 18, 6);
  ctx.fillStyle = p.rapid > 0 ? '#ffd400' : '#2a9df4'; ctx.fillRect(8, 3, 9, 6);
  ctx.fillStyle = '#ccc'; ctx.fillRect(23, 5, 5, 2);
  // hard hat
  ctx.fillStyle = '#ffd400'; ctx.beginPath(); ctx.arc(-1, 0, 8, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#e6be00'; ctx.fillRect(-1, -8, 2, 16);
  ctx.restore();
  // shield ring (wire nuts)
  if (p.shield > 0) {
    const n = 6;
    for (let i = 0; i < n; i++) {
      const a = time * 3 + i * 6.283 / n;
      const x = p.x + Math.cos(a) * 26, y = p.y + Math.sin(a) * 26;
      ctx.fillStyle = (p.shield < 2 && Math.floor(time * 10) % 2) ? '#663' : '#ff8c1a';
      ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x + 5, y + 4); ctx.lineTo(x - 5, y + 4); ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,140,26,0.25)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, 26, 0, 6.283); ctx.stroke();
  }
}

function zigzag(x1, y1, x2, y2, segs, amp) {
  ctx.beginPath(); ctx.moveTo(x1, y1);
  const dx = x2 - x1, dy = y2 - y1, l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
  for (let i = 1; i < segs; i++) { const t = i / segs, o = rand(-amp, amp); ctx.lineTo(x1 + dx * t + nx * o, y1 + dy * t + ny * o); }
  ctx.lineTo(x2, y2); ctx.stroke();
}

function drawEnemy(e) {
  const fl = e.flash > 0;
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.type === 'spark') {
    ctx.fillStyle = 'rgba(255,225,77,0.18)'; ctx.beginPath(); ctx.arc(0, 0, e.r * 2, 0, 6.283); ctx.fill();
    ctx.strokeStyle = fl ? '#fff' : e.col; ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) { const a = e.t * 7 + i * 1.57; zigzag(0, 0, Math.cos(a) * e.r * 1.6, Math.sin(a) * e.r * 1.6, 3, 3); }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, 6.283); ctx.fill();
  } else if (e.type === 'rat') {
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(2, 5, 14, 7, 0, 0, 6.283); ctx.fill();
    const a = Math.atan2(player.y - e.y, player.x - e.x); ctx.rotate(a);
    ctx.strokeStyle = '#d99'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-12, 0);
    ctx.quadraticCurveTo(-22, Math.sin(e.t * 12) * 8, -28, 0); ctx.stroke();
    ctx.fillStyle = fl ? '#fff' : e.col; ctx.beginPath(); ctx.ellipse(0, 0, 14, 9, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12, 0, 7, 5, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#d99'; ctx.beginPath(); ctx.arc(8, -7, 3.5, 0, 6.283); ctx.arc(8, 7, 3.5, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#f22'; ctx.fillRect(14, -3, 2, 2); ctx.fillRect(14, 2, 2, 2);
    // chewed wire in mouth
    ctx.strokeStyle = '#e33'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(19, -6); ctx.lineTo(19, 6); ctx.stroke();
  } else if (e.type === 'surge') {
    const pul = 1 + Math.sin(e.t * 6) * 0.08;
    ctx.fillStyle = 'rgba(77,210,255,0.15)'; ctx.beginPath(); ctx.arc(0, 0, e.r * 1.7 * pul, 0, 6.283); ctx.fill();
    ctx.fillStyle = fl ? '#fff' : '#0e3a55'; ctx.beginPath(); ctx.arc(0, 0, e.r * pul, 0, 6.283); ctx.fill();
    ctx.strokeStyle = e.col; ctx.lineWidth = 3; ctx.stroke();
    // lightning bolt glyph
    ctx.fillStyle = '#bff'; ctx.beginPath();
    ctx.moveTo(3, -13); ctx.lineTo(-7, 2); ctx.lineTo(0, 2); ctx.lineTo(-3, 13); ctx.lineTo(8, -3); ctx.lineTo(1, -3); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(160,240,255,0.7)'; ctx.lineWidth = 1.5;
    if (Math.random() < 0.5) { const a = rand(0, 6.283); zigzag(Math.cos(a) * e.r, Math.sin(a) * e.r, Math.cos(a) * e.r * 1.9, Math.sin(a) * e.r * 1.9, 3, 4); }
  } else if (e.type === 'arc') {
    ctx.rotate(e.t * 2);
    ctx.fillStyle = fl ? '#fff' : '#3a1655'; ctx.strokeStyle = e.col; ctx.lineWidth = 2.5;
    ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i * 1.047; ctx.lineTo(Math.cos(a) * e.r, Math.sin(a) * e.r); } ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = e.col; ctx.beginPath(); ctx.arc(0, 0, 5 + Math.sin(e.t * 10) * 2, 0, 6.283); ctx.fill();
  } else if (e.type === 'boss') {
    const enr = e.hp < e.maxHp * 0.4;
    ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(-44, -36, 96, 92);
    ctx.fillStyle = fl ? '#fff' : '#5b6370'; ctx.fillRect(-48, -58, 96, 112);
    ctx.strokeStyle = enr ? '#ff3020' : '#9aa3b0'; ctx.lineWidth = 3; ctx.strokeRect(-48, -58, 96, 112);
    ctx.fillStyle = '#2b3038'; ctx.fillRect(-38, -46, 76, 88);
    // breakers
    for (let r = 0; r < 6; r++) for (let c = 0; c < 2; c++) {
      const on = Math.sin(e.t * (3 + r) + c * 2) > (enr ? -0.3 : 0.3);
      ctx.fillStyle = on ? '#ff5a3c' : '#151515'; ctx.fillRect(-32 + c * 36, -40 + r * 14, 28, 10);
      ctx.fillStyle = '#ddd'; ctx.fillRect(-32 + c * 36 + (on ? 18 : 2), -38 + r * 14, 8, 6);
    }
    // face: angry meter eyes
    ctx.fillStyle = enr ? '#ff2a1a' : '#ffd400';
    ctx.beginPath(); ctx.arc(-18, -70, 7, 0, 6.283); ctx.arc(18, -70, 7, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#ff3020'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center'; ctx.fillText('⚠ 480V ⚠', 0, 50);
    // arcs around
    ctx.strokeStyle = enr ? 'rgba(255,90,60,0.9)' : 'rgba(255,220,80,0.8)'; ctx.lineWidth = 2;
    for (let i = 0; i < (enr ? 4 : 2); i++) { const a = rand(0, 6.283); zigzag(Math.cos(a) * 50, Math.sin(a) * 60, Math.cos(a) * 90, Math.sin(a) * 100, 4, 8); }
  }
  ctx.restore();
  // hp bar for tougher enemies
  if (!e.boss && e.maxHp > 2 && e.hp < e.maxHp) {
    ctx.fillStyle = '#300'; ctx.fillRect(e.x - 14, e.y - e.r - 9, 28, 4);
    ctx.fillStyle = '#f44'; ctx.fillRect(e.x - 14, e.y - e.r - 9, 28 * e.hp / e.maxHp, 4);
  }
}

function drawPickup(k) {
  const P = PTYPES[k.type];
  if (k.life < 3 && Math.floor(time * 8) % 2) return;
  const bob = Math.sin(k.t * 4) * 3;
  ctx.save(); ctx.translate(k.x, k.y + bob);
  ctx.fillStyle = P.col + '33'; ctx.beginPath(); ctx.arc(0, 0, 20 + Math.sin(k.t * 6) * 2, 0, 6.283); ctx.fill();
  ctx.strokeStyle = P.col; ctx.lineWidth = 2; ctx.stroke();
  if (k.type === 'tester') {
    ctx.rotate(0.5); ctx.fillStyle = '#ffd400'; ctx.fillRect(-4, -12, 8, 20); ctx.fillStyle = '#222'; ctx.fillRect(-4, 4, 8, 4);
    ctx.fillStyle = Math.floor(k.t * 6) % 2 ? '#f33' : '#fff'; ctx.fillRect(-2, -14, 4, 4);
  } else if (k.type === 'nut') {
    ctx.fillStyle = '#ff8c1a'; ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(9, 8); ctx.lineTo(-9, 8); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#a50'; ctx.lineWidth = 1; for (let i = -6; i < 8; i += 4) { ctx.beginPath(); ctx.moveTo(-5 - i * 0.2, i); ctx.lineTo(5 + i * 0.2, i); ctx.stroke(); }
  } else {
    ctx.fillStyle = '#222'; ctx.fillRect(-7, -11, 14, 22); ctx.strokeStyle = '#40ff7a'; ctx.strokeRect(-7, -11, 14, 22);
    ctx.fillStyle = '#40ff7a'; ctx.fillRect(-4, -8, 8, 7); ctx.fillStyle = '#ddd'; ctx.fillRect(-3, 2, 6, 6);
  }
  ctx.restore();
}

function hint(kb, ps, tc) { return inputMode === 'pad' ? ps : (inputMode === 'touch' && tc !== undefined) ? tc : kb; }

function drawHUD() {
  const p = player;
  // health bar
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(14, 12, 244, 54);
  ctx.fillStyle = '#9ab'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'left'; ctx.fillText('LINE VOLTAGE', 22, 27);
  ctx.fillStyle = '#300'; ctx.fillRect(22, 32, 228, 12);
  const hpf = p.hp / p.maxHp;
  ctx.fillStyle = hpf > 0.5 ? '#40ff7a' : hpf > 0.25 ? '#ffd400' : '#ff3b30'; ctx.fillRect(22, 32, 228 * hpf, 12);
  ctx.strokeStyle = '#678'; ctx.strokeRect(22.5, 32.5, 228, 12);
  // dash meter
  const dr = clamp(1 - p.dashCd / 0.9, 0, 1);
  ctx.fillStyle = '#123'; ctx.fillRect(22, 50, 228, 5); ctx.fillStyle = dr >= 1 ? '#7fdcff' : '#357'; ctx.fillRect(22, 50, 228 * dr, 5);
  ctx.fillStyle = '#9ab'; ctx.font = '9px monospace'; ctx.fillText('DASH ' + hint('[SHIFT/SPACE/RMB]', '[✕ / L2]', '[DASH BUTTON]'), 22, 63);
  // powerups
  let px = 270;
  if (p.rapid > 0) { pill(px, 'RAPID ' + p.rapid.toFixed(1), '#ffd400'); px += 112; }
  if (p.shield > 0) { pill(px, 'SHIELD ' + p.shield.toFixed(1), '#ff8c1a'); px += 112; }
  // score
  ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = 'bold 26px Impact, Arial Black, sans-serif';
  ctx.fillText(score.toLocaleString(), W - 18, 38);
  ctx.font = 'bold 11px monospace'; ctx.fillStyle = '#9ab';
  ctx.fillText('WAVE ' + wave + '   HI ' + Math.max(highScore, score).toLocaleString(), W - 18, 56);
  if (combo > 1.05) { ctx.fillStyle = '#ffd400'; ctx.fillText('x' + combo.toFixed(1) + ' COMBO', W - 18, 72); }
  // boss bar
  const boss = enemies.find(e => e.boss);
  if (boss) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(W / 2 - 210, H - 42, 420, 30);
    ctx.fillStyle = '#ff5a3c'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
    ctx.fillText('THE OVERLOADED PANEL' + (boss.lvl > 1 ? ' MK ' + boss.lvl : ''), W / 2, H - 29);
    ctx.fillStyle = '#300'; ctx.fillRect(W / 2 - 200, H - 24, 400, 8);
    ctx.fillStyle = '#ff5a3c'; ctx.fillRect(W / 2 - 200, H - 24, 400 * Math.max(0, boss.hp / boss.maxHp), 8);
  }
}
function pill(x, t, c) {
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x, 12, 104, 22);
  ctx.strokeStyle = c; ctx.strokeRect(x + .5, 12.5, 104, 22);
  ctx.fillStyle = c; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center'; ctx.fillText(t, x + 52, 27);
}

function bigText(t, y, size, col) {
  ctx.font = `bold ${size}px Impact, Arial Black, sans-serif`; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(t, W / 2 + 3, y + 3);
  ctx.fillStyle = col; ctx.fillText(t, W / 2, y);
}

function drawTitle() {
  ctx.drawImage(bg, 0, 0);
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, W, H);
  const rW = W, rH = H, portrait = rH > rW;
  const sc = Math.min(1, rW / 780, rH / 620);   // shrink title layout on small/narrow screens
  W = rW / sc; H = rH / sc;
  ctx.save(); ctx.scale(sc, sc); ctx.translate(0, Math.max(0, (H - 600) / 2));
  try { drawTitleInner(portrait); } finally { ctx.restore(); W = rW; H = rH; }
}
function drawTitleInner(portrait) {
  // animated arcs behind title
  ctx.strokeStyle = 'rgba(120,220,255,0.6)'; ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) zigzag(120, 150 + i * 6, W - 120, 150 + i * 6, 18, 14);
  const flick = Math.random() < 0.04 ? '#555' : '#ffd400';
  bigText('LIVE WIRE', 175, 104, flick);
  ctx.font = 'bold 16px monospace'; ctx.fillStyle = '#7fdcff'; ctx.textAlign = 'center';
  ctx.fillText('A JOURNEYMAN\'S LAST SHIFT — PORTLAND, OR', W / 2, 215);
  // controls
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(W / 2 - 300, 245, 600, 200);
  ctx.strokeStyle = '#334'; ctx.strokeRect(W / 2 - 300 + .5, 245.5, 600, 200);
  ctx.font = '15px monospace'; ctx.textAlign = 'left'; ctx.fillStyle = '#cde';
  const lines = inputMode === 'touch' ? [
    ['MOVE', 'Left thumb: drag anywhere on left half'], ['AIM', 'Right thumb: drag on right half'], ['SHOOT', 'Auto-fires while right thumb is down'],
    ['DASH', 'DASH button (bottom right)'], ['PAUSE', '⏸ button (top right)'], ['TIP', 'Hold right side without dragging = auto-aim']
  ] : inputMode === 'pad' ? [
    ['MOVE', 'Left stick / D-pad'], ['AIM', 'Right stick (auto-aim when released)'], ['SHOOT', 'R2 (hold) or push right stick'],
    ['DASH', '✕ Cross / L2 / L1'], ['PAUSE', 'OPTIONS'], ['MUTE', 'Touchpad / Create']
  ] : [
    ['MOVE', 'WASD / Arrow keys'], ['AIM', 'Mouse'], ['SHOOT', 'Left click (hold = auto-fire)'],
    ['DASH', 'Shift / Space / Right click'], ['PAUSE', 'P / Esc'], ['MUTE', 'M']
  ];
  lines.forEach(([a, b], i) => { ctx.fillStyle = '#ffd400'; ctx.fillText(a, W / 2 - 270, 278 + i * 26); ctx.fillStyle = '#cde'; ctx.fillText(b, W / 2 - 160, 278 + i * 26); });
  // pickup legend
  ctx.font = '12px monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd400'; ctx.fillText('⚡ VOLTAGE TESTER = RAPID FIRE', W / 2 - 200, 470);
  ctx.fillStyle = '#ff8c1a'; ctx.fillText('▲ WIRE NUTS = SHIELD', W / 2, 470);
  ctx.fillStyle = '#40ff7a'; ctx.fillText('▮ BREAKER RESET = +HP', W / 2 + 190, 470);
  ctx.fillStyle = '#ff5a3c'; ctx.fillText('Boss every 5 waves: THE OVERLOADED PANEL', W / 2, 492);
  if (Math.floor(time * 2) % 2 === 0) bigText(hint('CLICK OR PRESS ENTER TO CLOCK IN', 'PRESS ✕ TO CLOCK IN', 'TAP TO CLOCK IN'), 540, 28, '#fff');
  if (portrait) { ctx.font = 'bold 15px monospace'; ctx.fillStyle = '#ffd400'; ctx.textAlign = 'center'; ctx.fillText('↻ Rotate your phone to landscape for the best view', W / 2, 610); }
  ctx.font = 'bold 13px monospace'; ctx.fillStyle = '#9ab'; ctx.textAlign = 'center';
  ctx.fillText('HIGH SCORE  ' + highScore.toLocaleString() + (muted ? '   ·   SOUND OFF' : ''), W / 2, 575);
}

function draw() {
  ctx.setTransform(VS, 0, 0, VS, 0, 0);
  if (state === 'title') { drawTitle(); drawToast(); return; }
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  ctx.drawImage(bg, 0, 0);
  // pickups
  for (const k of pickups) drawPickup(k);
  // enemies
  for (const e of enemies) drawEnemy(e);
  // player
  if (state !== 'over') drawPlayer(player);
  // bullets (batched)
  ctx.strokeStyle = player.rapid > 0 ? '#ffe14d' : '#8fe8ff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  for (const b of bullets) { ctx.moveTo(b.x - b.vx * 0.018, b.y - b.vy * 0.018); ctx.lineTo(b.x, b.y); }
  ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.beginPath();
  for (const b of bullets) { ctx.moveTo(b.x - b.vx * 0.008, b.y - b.vy * 0.008); ctx.lineTo(b.x, b.y); }
  ctx.stroke(); ctx.lineCap = 'butt';
  // enemy bullets
  ctx.fillStyle = 'rgba(255,90,60,0.3)'; ctx.beginPath();
  for (const b of ebullets) { ctx.moveTo(b.x + 10, b.y); ctx.arc(b.x, b.y, 10, 0, 6.283); } ctx.fill();
  ctx.fillStyle = '#ffb090'; ctx.beginPath();
  for (const b of ebullets) { ctx.moveTo(b.x + 5, b.y); ctx.arc(b.x, b.y, 5, 0, 6.283); } ctx.fill();
  // particles (additive)
  ctx.globalCompositeOperation = 'lighter';
  for (const q of particles) { ctx.globalAlpha = Math.max(0, q.life / q.max); ctx.fillStyle = q.col; ctx.fillRect(q.x - q.sz / 2, q.y - q.sz / 2, q.sz, q.sz); }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // floaters
  ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
  for (const f of floaters) { ctx.globalAlpha = Math.max(0, f.t); ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, f.y); }
  ctx.globalAlpha = 1;
  // crosshair
  if (state === 'play' && inputMode === 'kb') {
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 9, 0, 6.283);
    ctx.moveTo(mouse.x - 14, mouse.y); ctx.lineTo(mouse.x - 5, mouse.y); ctx.moveTo(mouse.x + 5, mouse.y); ctx.lineTo(mouse.x + 14, mouse.y);
    ctx.moveTo(mouse.x, mouse.y - 14); ctx.lineTo(mouse.x, mouse.y - 5); ctx.moveTo(mouse.x, mouse.y + 5); ctx.lineTo(mouse.x, mouse.y + 14); ctx.stroke();
  } else if (state === 'play') {
    const ax = player.x + Math.cos(player.ang) * 60, ay = player.y + Math.sin(player.ang) * 60;
    ctx.fillStyle = 'rgba(127,220,255,0.8)'; ctx.beginPath(); ctx.arc(ax, ay, 3, 0, 6.283); ctx.fill();
  }
  ctx.restore();
  // low-hp vignette
  if (state === 'play' && player.hp < 30) { ctx.fillStyle = `rgba(255,0,0,${0.08 + Math.sin(time * 6) * 0.05})`; ctx.fillRect(0, 0, W, H); }
  drawHUD();
  drawTouchUI();
  // banner
  if (bannerT > 0 && state === 'play') {
    const a = Math.min(1, bannerT, (2.4 - bannerT) * 4);
    ctx.globalAlpha = a; bigText(bannerA, H / 2 - 30, 56, '#ffd400');
    ctx.font = 'bold 16px monospace'; ctx.fillStyle = '#cde'; ctx.textAlign = 'center'; ctx.fillText(bannerB, W / 2, H / 2 + 4);
    ctx.globalAlpha = 1;
  }
  if (state === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
    bigText('ON BREAK', H / 2 - 20, 72, '#ffd400');
    ctx.font = 'bold 16px monospace'; ctx.fillStyle = '#cde'; ctx.textAlign = 'center';
    ctx.fillText(hint('P / ESC to resume   ·   M to mute', 'OPTIONS or ✕ to resume   ·   TOUCHPAD to mute', 'TAP ANYWHERE TO RESUME'), W / 2, H / 2 + 24);
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(10,0,0,0.65)'; ctx.fillRect(0, 0, W, H);
    bigText('ELECTROCUTED', H / 2 - 70, 80, '#ff3b30');
    ctx.font = 'bold 18px monospace'; ctx.fillStyle = '#cde'; ctx.textAlign = 'center';
    ctx.fillText('Should\'ve used the lockout/tagout, bud.', W / 2, H / 2 - 30);
    bigText(score.toLocaleString(), H / 2 + 30, 48, '#fff');
    ctx.font = 'bold 16px monospace'; ctx.fillStyle = newHigh ? '#ffd400' : '#9ab';
    ctx.fillText(newHigh ? '★ NEW HIGH SCORE ★' : 'HIGH SCORE ' + highScore.toLocaleString(), W / 2, H / 2 + 62);
    ctx.fillStyle = '#9ab'; ctx.fillText('Reached wave ' + wave, W / 2, H / 2 + 86);
    if (Math.floor(time * 2) % 2 === 0) bigText(hint('CLICK OR PRESS ENTER TO CLOCK BACK IN', 'PRESS ✕ TO CLOCK BACK IN', 'TAP TO CLOCK BACK IN'), H / 2 + 140, 26, '#fff');
  }
  drawToast();
}
function drawToast() {
  if (toastT <= 0) return;
  ctx.globalAlpha = Math.min(1, toastT * 2);
  ctx.font = 'bold 15px monospace'; const w = ctx.measureText(toastMsg).width + 30;
  ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(W / 2 - w / 2, H - 96, w, 30);
  ctx.strokeStyle = '#7fdcff'; ctx.strokeRect(W / 2 - w / 2 + .5, H - 95.5, w, 30);
  ctx.fillStyle = '#7fdcff'; ctx.textAlign = 'center'; ctx.fillText(toastMsg, W / 2, H - 76);
  ctx.globalAlpha = 1;
}

// ---------- main loop (fixed-step for stability) ----------
let last = performance.now(), acc = 0;
const STEP = 1 / 120;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  pollPad();
  acc += dt;
  requestAnimationFrame(frame);
  try { while (acc >= STEP) { update(STEP); acc -= STEP; } draw(); }
  catch (err) { acc = 0; console.error(err); }
}
fit();
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
// test hook
window.__liveWire = { get state() { return state; }, startGame, get score() { return score; }, get wave() { return wave; },
  get enemies() { return enemies.length; }, get hp() { return player ? player.hp : 0; }, get pos() { return player ? [Math.round(player.x), Math.round(player.y)] : null; },
  get shots() { return shotCount; }, get btns() { return touchButtons(); }, get W() { return W; }, get H() { return H; },
  skipTo(n) { wave = n - 1; enemies.length = 0; waveToSpawn = 0; bossAlive = false; waveDelay = 0; }, hurt(d) { player.inv = 0; player.shield = 0; damagePlayer(d); } };
</script>
